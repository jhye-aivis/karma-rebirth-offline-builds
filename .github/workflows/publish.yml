name: KARMA Windows smoke, Pages and tagged release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: karma-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate real Windows benchmark launcher and HTML
        shell: powershell
        run: |
          foreach ($name in @('windows_compare.ps1','serve_windows.ps1')) {
            $tokens = $null
            $problems = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $pwd ('site/'+$name)), [ref]$tokens, [ref]$problems) | Out-Null
            if ($problems.Count -gt 0) { throw ($name+' syntax errors: '+($problems | Out-String)) }
          }
          if (!(Test-Path 'site/COMPARE_WINDOWS.html')) { throw 'Missing Windows same-PC A/B benchmark HTML' }
      - name: Windows PowerShell 5.1 loopback HTTP smoke (NOT GPU gameplay)
        shell: pwsh
        run: |
          $script = Join-Path $pwd "site/serve_windows.ps1"
          if (!(Test-Path $script)) { throw "Missing Windows runner server" }
          $arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + $script + '" -NoBrowser'
          $server = Start-Process -FilePath "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -ArgumentList $arguments -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 25; $i++) {
              Start-Sleep -Milliseconds 400
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/index.html" -UseBasicParsing -TimeoutSec 4
                if ($response.StatusCode -eq 200 -and $response.Content -like "*KARMA*") { $ok = $true; break }
              } catch {}
            }
            if (!$ok) { throw "Windows local HTTP game entry failed" }
            $js = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/engine.js" -UseBasicParsing
            $comparison = Invoke-WebRequest -Uri "http://127.0.0.1:8877/COMPARE_WINDOWS.html" -UseBasicParsing
            $asset = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/characters/panzergrenadier_cc0.glb" -Method Head -UseBasicParsing
            if ($js.StatusCode -ne 200 -or $asset.StatusCode -ne 200) { throw "Game engine or source GLB unavailable" }
            if ($comparison.StatusCode -ne 200 -or $comparison.Content -notlike '*Windows Chrome*') { throw "Benchmark HTML unavailable" }
            Write-Host "WINDOWS SERVER PASS / HTML JS CC0 GLB"
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
  pages:
    if: github.ref == 'refs/heads/main'
    needs: windows-smoke
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive verified Windows portable release
        run: |
          cd site
          zip -qr "../KARMA_REBIRTH_${GITHUB_REF_NAME}_Windows_Offline.zip" .
      - name: Publish release from verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "KARMA_REBIRTH_${GITHUB_REF_NAME}_Windows_Offline.zip" --title "KARMA REBIRTH $GITHUB_REF_NAME — CC0 German model" --notes "Unofficial FPS reconstruction. Source-licensed CC0 Panzergrenadier only; no original KARMA game meshes. Windows runner HTTP smoke is not graphics/manual game testing."
