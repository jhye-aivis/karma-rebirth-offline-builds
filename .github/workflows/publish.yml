name: KARMA Windows smoke, Pages and tagged release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: karma-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate real Windows benchmark launcher and HTML
        shell: powershell
        run: |
          foreach ($name in @('windows_compare.ps1','serve_windows.ps1')) {
            $tokens = $null
            $problems = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $pwd ('site/'+$name)), [ref]$tokens, [ref]$problems) | Out-Null
            if ($problems.Count -gt 0) { throw ($name+' syntax errors: '+($problems | Out-String)) }
          }
          if (!(Test-Path 'site/COMPARE_WINDOWS.html')) { throw 'Missing Windows same-PC A/B benchmark HTML' }
      - name: Windows PowerShell 5.1 loopback HTTP smoke (NOT GPU gameplay)
        shell: pwsh
        run: |
          $script = Join-Path $pwd "site/serve_windows.ps1"
          if (!(Test-Path $script)) { throw "Missing Windows runner server" }
          $arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + $script + '" -NoBrowser'
          $server = Start-Process -FilePath "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -ArgumentList $arguments -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 25; $i++) {
              Start-Sleep -Milliseconds 400
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/index.html" -UseBasicParsing -TimeoutSec 4
                if ($response.StatusCode -eq 200 -and $response.Content -like "*KARMA*") { $ok = $true; break }
              } catch {}
            }
            if (!$ok) { throw "Windows local HTTP game entry failed" }
            $js = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/engine.js" -UseBasicParsing
            $comparison = Invoke-WebRequest -Uri "http://127.0.0.1:8877/COMPARE_WINDOWS.html" -UseBasicParsing
            $jump = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/jump.js" -UseBasicParsing
            $weaponVfx = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/weapon-vfx.js" -UseBasicParsing
            $weaponArt = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/weapon-art.js" -UseBasicParsing
            $combatFX = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/combat-feedback.js" -UseBasicParsing
            $variants = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/variants.js" -UseBasicParsing
            $roleManifest = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/characters/wave23-variants.json" -UseBasicParsing
            $germanW23 = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/characters/panzergrenadier_wave23_german.glb" -Method Head -UseBasicParsing
            $sovietW23 = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/characters/panzergrenadier_wave23_soviet.glb" -Method Head -UseBasicParsing
            $atlasG23 = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/characters/wave23_gear_atlas_german.png" -Method Head -UseBasicParsing
            $atlasS23 = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/characters/wave23_gear_atlas_soviet.png" -Method Head -UseBasicParsing
            $surfaceAtlas = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/environment/wave21_surface_atlas.png" -Method Head -UseBasicParsing
            $mp40 = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/weapons/wave22_mp40.mesh" -Method Head -UseBasicParsing
            $ppsh = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/weapons/wave22_ppsh.mesh" -Method Head -UseBasicParsing
            $mp40glb = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/weapons/wave22_mp40.glb" -Method Head -UseBasicParsing
            $ppshglb = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/weapons/wave22_ppsh.glb" -Method Head -UseBasicParsing
            $germanW22 = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/characters/panzergrenadier_wave22_german.glb" -Method Head -UseBasicParsing
            $sovietW22 = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/characters/panzergrenadier_wave22_soviet.glb" -Method Head -UseBasicParsing
            $asset = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/characters/panzergrenadier_cc0.glb" -Method Head -UseBasicParsing
            $germanAI = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/characters/panzergrenadier_cc0_npc_lod.glb" -Method Head -UseBasicParsing
            $opposingAI = Invoke-WebRequest -Uri "http://127.0.0.1:8877/three-d/assets/characters/soviet_side_derived_cc0_interim.glb" -Method Head -UseBasicParsing
            if ($js.StatusCode -ne 200 -or $asset.StatusCode -ne 200) { throw "Game engine or source GLB unavailable" }
            if ($germanAI.StatusCode -ne 200 -or $opposingAI.StatusCode -ne 200) { throw "Source-derived skinned 4v4 NPC rigs unavailable in Windows portable game" }
            if ($comparison.StatusCode -ne 200 -or $comparison.Content -notlike '*Windows Chrome*') { throw "Benchmark HTML unavailable" }
            if ($jump.StatusCode -ne 200 -or $jump.Content -notlike '*KarmaJump*') { throw "Wave21 Space jump JS missing" }
            if ($weaponVfx.StatusCode -ne 200 -or $weaponVfx.Content -notlike '*KarmaWeaponVFX*') { throw "Wave21 weapon effects JS missing" }
            if ($surfaceAtlas.StatusCode -ne 200) { throw "Wave21 material texture missing" }
            if ($weaponArt.StatusCode -ne 200 -or $weaponArt.Content -notlike '*KarmaWeaponArt*') { throw "Wave22 new modeled gun renderer missing" }
            foreach ($obj in @($mp40,$ppsh,$mp40glb,$ppshglb,$germanW22,$sovietW22)) {
              if ($obj.StatusCode -ne 200) { throw "Wave22 original modeled 3D source mesh/GLB unavailable" }
            }
            foreach ($obj in @($germanW23,$sovietW23,$atlasG23,$atlasS23)) {
              if ($obj.StatusCode -ne 200) { throw "Wave23 rigged 3D visual variant or shared gear atlas missing" }
            }
            if ($combatFX.StatusCode -ne 200 -or $combatFX.Content -notlike '*KarmaCombatFeedback*') { throw "Wave23 hit feedback engine missing" }
            if ($variants.StatusCode -ne 200 -or $variants.Content -notlike '*KarmaWave23Variants*') { throw "Wave23 6 role runtime missing" }
            if ($roleManifest.StatusCode -ne 200 -or $roleManifest.Content -notlike '*G03*' -or $roleManifest.Content -notlike '*S03*') { throw "Wave23 6 role JSON manifest missing" }
            if ($response.Content -notlike '*wave23*') { throw "Wave23 game entry not updated" }
            if ($response.Content -notlike '*Space*') { throw "Wave21 Space controls not discoverable" }
            Write-Host "WINDOWS SERVER PASS / 6 SKINNED ROLE SLOTS / SINGLE ATLAS PER FACTION / COMBAT FEEDBACK / SPACE / MODELED MP40 PPSh"
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
  pages:
    if: github.ref == 'refs/heads/main'
    needs: windows-smoke
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive verified Windows portable release
        run: |
          cd site
          zip -qr "../KARMA_REBIRTH_${GITHUB_REF_NAME}_Windows_Offline.zip" .
      - name: Publish release from verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "KARMA_REBIRTH_${GITHUB_REF_NAME}_Windows_Offline.zip" --title "KARMA REBIRTH $GITHUB_REF_NAME — 6 Rigged Loadouts + Hit Feedback" --notes "Wave23: original Blender 3D German G01-G03 / Soviet-styled S01-S03 gear sets, one CC0 original-derived shared 64-bone GLB per faction with selected role equipment/atlas, authoritative TDM damage events drive 3D skinned hit reactions, outgoing hitmarker, incoming directional HUD and reduced motion. Wave22 original modeled MP40/PPSh and Wave21 jump remain. Mac Chrome software SwiftShader 8-bot FPS remains ~12-13 despite CPU scene optimization; NO claimed 60FPS or user's Windows GPU test. Head-only hit classification uses geometry sphere; arms/legs classified torso because no per-bone hitboxes. Soviet outfit still German CC0 source derivative, not independently licensed artist USSR character. Windows CI is HTTP/PowerShell smoke, NOT actual Windows GPU gameplay. See WAVE23_RESULT.md and user local COMPARE_WINDOWS.bat."
